services:
  db:
    image: postgres:15-alpine
    container_name: code-arena-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code-arena_bd
    ports:
      - "5433:5432"
    volumes:
      - code-arena-volume:/var/lib/postgresql/data

volumes:
  code-arena-volume:
